[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storymotion-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Pillow>=10.4,<14", "pydantic>=2.8,<3", "faster-whisper>=1.2,<2", "av>=11,<19"]

[tool.setuptools.packages.find]
include = ["storymotion*"]
